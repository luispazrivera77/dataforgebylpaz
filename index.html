<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataForge — Constructor de formularios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-app: #06070a;
        --bg-screen: #0b0d12;
        --surface: #15171f;
        --surface-2: #1d2029;
        --surface-hover: #242835;
        --border: #262a38;
        --text: #f4f2ec;
        --text-dim: #8b90a3;
        --text-faint: #565b6e;

        --gold: #d9a653;
        --gold-hover: #e6ba71;
        --gold-soft: rgba(217, 166, 83, 0.14);

        --danger: #e2685f;
        --success: #4fb08a;

        /* escala de profundidad: raíz, hijo, nieto, bisnieto... (cíclica) */
        --depth-0: #4fb3ac;
        --depth-1: #d9a653;
        --depth-2: #c97fa0;
        --depth-3: #8c86d9;

        --font-display: 'Fraunces', Georgia, serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
        --font-body: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: var(--font-body);
        background: var(--bg-app);
        color: var(--text);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .phone-frame {
        width: 366px;
        height: 728px;
        background: linear-gradient(160deg, #26241f, #17161a 55%, #201d17);
        border-radius: 52px;
        padding: 8px;
        box-shadow: 0 30px 70px rgba(0,0,0,0.85), inset 0 0 0 1px rgba(255,255,255,0.04);
        position: relative;
    }

    .phone-cam {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #050505;
        box-shadow: 0 0 0 3px rgba(255,255,255,0.03);
        z-index: 10;
    }

    .phone-screen {
        width: 100%;
        height: 100%;
        background:
            radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0) 0 0/22px 22px,
            var(--bg-screen);
        border-radius: 44px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 38px 20px 18px 20px;
        box-sizing: border-box;
        overflow-y: auto;
        min-height: 0;
    }

    .screen.hidden { display: none; }

    .brand-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
    }

    .brand {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 19px;
        letter-spacing: -0.01em;
    }

    .brand small {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--gold);
        display: block;
        letter-spacing: 0.12em;
        margin-top: 2px;
        font-weight: 500;
    }

    h2 {
        font-family: var(--font-display);
        font-size: 18px;
        margin: 0 0 4px 0;
        font-weight: 600;
    }

    .subtitle {
        font-size: 12px;
        color: var(--text-dim);
        margin: 0 0 16px 0;
        line-height: 1.5;
    }

    label.field-label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-dim);
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: block;
        margin-bottom: 6px;
    }

    input, select {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 11px 13px;
        border-radius: 12px;
        font-size: 13.5px;
        font-family: var(--font-body);
        outline: none;
        width: 100%;
    }

    input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
    input::placeholder { color: var(--text-faint); }

    .builder-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 220px;
        overflow-y: auto;
        margin-bottom: 4px;
    }

    .field-builder-row {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .row-inputs { display: flex; gap: 8px; }
    .row-inputs input { flex: 1.4; }
    .row-inputs select { flex: 1; }

    .btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 11px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 13px;
        font-family: var(--font-body);
        font-weight: 500;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: 0.15s;
    }

    .btn:hover { background: var(--surface-hover); border-color: var(--text-faint); }
    .btn-icon-only { padding: 8px; }
    .btn-gold { background: var(--gold); border: none; color: #1a1409; font-weight: 600; }
    .btn-gold:hover { background: var(--gold-hover); }
    .btn-ghost-gold { border-color: rgba(217,166,83,0.35); color: var(--gold); }
    .btn-ghost-gold:hover { background: var(--gold-soft); }
    .btn-success { background: var(--success); border: none; color: #06251b; font-weight: 600; }
    .btn-danger-outline { color: var(--danger); border-color: rgba(226,104,95,0.3); }
    .btn-danger-solid { background: var(--danger); border: none; color: #2a0805; font-weight: 600; }
    .btn-danger-solid:hover { background: #ea8078; }
    .btn-tiny { padding: 5px 9px; font-size: 10.5px; border-radius: 8px; }
    .btn-full { width: 100%; }
    .btn-row { display: flex; gap: 8px; }

    svg.ic { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* ---------- Empty state ---------- */
    .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
        padding: 20px;
    }

    .empty-state .ring {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 1.5px dashed var(--text-faint);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold);
    }

    .empty-state h3 {
        font-family: var(--font-display);
        font-size: 16px;
        margin: 0;
        font-weight: 600;
    }

    .empty-state p {
        font-size: 12px;
        color: var(--text-dim);
        margin: 0;
        max-width: 240px;
        line-height: 1.5;
    }

    /* ---------- Launcher cards ---------- */
    .app-launcher-grid {
        display: flex;
        flex-direction: column;
        gap: 9px;
        overflow-y: auto;
    }

    .app-icon-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 13px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: 0.15s;
        position: relative;
    }

    .app-icon-card::before {
        content: "";
        position: absolute;
        inset: 3px -4px -4px 3px;
        border-radius: 14px;
        background: var(--surface-2);
        z-index: -1;
        opacity: 0;
        transition: 0.15s;
    }

    .app-icon-card.has-stack::before { opacity: 1; }

    .app-icon-card:hover { border-color: var(--text-faint); background: var(--surface-hover); }

    .depth-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .app-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .app-title { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; }
    .app-meta { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.03em; }
    .app-meta strong { color: var(--text-dim); }

    /* ---------- Runtime ---------- */
    .breadcrumb {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-faint);
        margin-bottom: 10px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
    }

    .crumb { display: flex; align-items: center; gap: 5px; }
    .crumb .depth-dot { width: 6px; height: 6px; }
    .crumb.crumb-active { color: var(--text); font-weight: 600; }

    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
    }

    .form-header-title { display: flex; align-items: center; gap: 8px; }
    .form-header-title .depth-dot { width: 8px; height: 8px; }
    #runtime-title { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; }
    #record-indicator { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }

    .runtime-scroll { flex: 1; overflow-y: auto; min-height: 0; }

    .form-card { display: flex; flex-direction: column; gap: 13px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }

    .context-banner {
        background: var(--surface);
        padding: 9px 11px;
        border-radius: 10px;
        font-size: 11.5px;
        color: var(--text-dim);
        border-left: 2.5px solid var(--gold);
        margin-bottom: 12px;
        line-height: 1.4;
    }

    .context-banner strong { color: var(--text); font-weight: 600; }

    .thread {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px dashed var(--border);
        position: relative;
    }

    .thread-label {
        font-family: var(--font-mono);
        font-size: 9.5px;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
    }

    .thread-list { position: relative; padding-left: 14px; }

    .thread-list::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 6px;
        bottom: 6px;
        width: 1px;
        background: repeating-linear-gradient(to bottom, var(--border) 0 4px, transparent 4px 8px);
    }

    .thread-item {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: 0.15s;
    }

    .thread-item::before {
        content: "";
        position: absolute;
        left: -14px;
        top: 50%;
        transform: translateY(-50%);
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
    }

    .thread-item:hover { border-color: var(--gold); background: var(--surface-hover); }
    .thread-item-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
    .thread-item-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }

    .nav-bar {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding-top: 12px;
        margin-top: 8px;
        border-top: 1px solid var(--border);
    }

    .nav-bar .btn { flex: 1; }

    .record-actions-row { display: flex; gap: 6px; margin-top: 8px; }
    .record-actions-row .btn { flex: 1; font-size: 10.5px; padding: 9px 4px; }

    .action-row { display: flex; gap: 7px; margin-top: 8px; }
    .action-row .btn { flex: 1; font-size: 11.5px; }

    .btn-saved {
        background: var(--success) !important;
        border-color: var(--success) !important;
        color: #06251b !important;
    }

    /* ---------- Toggle vista tabla ---------- */
    .view-toggle {
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-dim);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 4px 4px;
        cursor: pointer;
    }

    .view-toggle-opt {
        padding: 4px 9px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .view-toggle-opt.active { background: var(--gold); color: #1a1409; font-weight: 600; }

    /* ---------- Tabla de registros ---------- */
    .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
    }

    table.records-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 11.5px;
    }

    table.records-table th {
        font-family: var(--font-mono);
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-dim);
        text-align: left;
        padding: 9px 10px;
        background: var(--surface-2);
        white-space: nowrap;
        position: sticky;
        top: 0;
    }

    table.records-table td {
        padding: 9px 10px;
        border-top: 1px solid var(--border);
        white-space: nowrap;
        max-width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
    }

    table.records-table tr.table-row { cursor: pointer; transition: 0.12s; }
    table.records-table tr.table-row:hover td { background: var(--surface-hover); }
    table.records-table tr.table-row-active td { background: var(--gold-soft); }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
    }

    .pill {
        font-family: var(--font-mono);
        font-size: 9.5px;
        padding: 3px 8px;
        border-radius: 20px;
        font-weight: 600;
        letter-spacing: 0.04em;
    }
</style>
</head>
<body>

<div class="phone-frame">
    <div class="phone-cam"></div>
    <div class="phone-screen">

        <!-- Lanzador -->
        <section id="screen-launcher" class="screen">
            <div class="brand-row">
                <div class="brand">DataForge<small>CONSTRUCTOR DE DATOS</small></div>
                <div style="display:flex; gap:6px;">
                    <button id="export-btn" onclick="exportAllData()" class="btn btn-ghost-gold btn-icon-only" title="Exportar a Excel" style="display:none;">
                        <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 21h14"/></svg>
                    </button>
                    <button onclick="startNewForm()" class="btn btn-gold btn-icon-only" title="Crear formulario">
                        <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
            </div>

            <div id="launcher-empty" class="empty-state" style="display:none;">
                <div class="ring">
                    <svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px;"><path d="M12 5v14M5 12h14"/></svg>
                </div>
                <h3>Crea tu primer formulario</h3>
                <p>Puede ser cualquier cosa: clientes, pacientes, pedidos, inventario. Empieza por el dato principal de tu proceso.</p>
                <button onclick="startNewForm()" class="btn btn-gold">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Crear formulario
                </button>
            </div>

            <div id="launcher-list" class="app-launcher-grid"></div>
        </section>

        <!-- Diseñador -->
        <section id="screen-builder" class="screen hidden">
            <div class="top-bar">
                <span id="builder-step-label" class="pill" style="background:var(--gold-soft); color:var(--gold);">Nuevo</span>
                <button onclick="showLauncher()" class="btn btn-tiny">
                    <svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                    Inicio
                </button>
            </div>

            <h2 id="builder-heading">Definir formulario</h2>
            <p class="subtitle" id="builder-subtitle">Dale un nombre y agrega los datos que quieres registrar.</p>

            <div style="margin-bottom: 14px;">
                <label class="field-label">Nombre</label>
                <input type="text" id="form-title-input" placeholder="Ej. Clientes, Pedidos, Pacientes…">
            </div>

            <div id="pivot-section" style="margin-bottom: 14px; display: none;">
                <label class="field-label">Depende de</label>
                <select id="form-pivot-source">
                    <option value="">No depende de otro — es un formulario principal</option>
                </select>
            </div>

            <label class="field-label">Datos a registrar</label>
            <div id="builder-fields-container" class="builder-container"></div>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                <button type="button" onclick="addBuilderField()" class="btn btn-ghost-gold">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Agregar dato
                </button>
                <button type="button" onclick="saveAndReturnLauncher()" class="btn btn-success">
                    Guardar formulario
                </button>
            </div>
        </section>

        <!-- Runtime -->
        <section id="screen-runtime" class="screen hidden">
            <div id="runtime-breadcrumb" class="breadcrumb"></div>

            <div class="form-header">
                <div class="form-header-title">
                    <span id="runtime-depth-dot" class="depth-dot"></span>
                    <strong id="runtime-title">Formulario</strong>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span id="record-indicator">1 / 1</span>
                    <div id="view-toggle" class="view-toggle" style="display:none;">
                        <span class="view-toggle-opt" data-mode="record" onclick="setViewMode('record')">
                            <svg class="ic" viewBox="0 0 24 24" style="width:11px;height:11px;"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                        </span>
                        <span class="view-toggle-opt" data-mode="table" onclick="setViewMode('table')">
                            <svg class="ic" viewBox="0 0 24 24" style="width:11px;height:11px;"><path d="M3 9h18M3 15h18M9 3v18"/></svg>
                        </span>
                    </div>
                </div>
            </div>

            <div class="runtime-scroll">
                <div id="runtime-card" class="form-card"></div>
                <div id="runtime-table" style="display:none;"></div>
                <div id="children-section" class="thread" style="display:none;">
                    <div class="thread-label">Formularios relacionados</div>
                    <div id="children-list" class="thread-list"></div>
                </div>
            </div>

            <div id="record-nav-bar" class="nav-bar">
                <button onclick="changeRecord(-1)" class="btn">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    Anterior
                </button>
                <button onclick="changeRecord(1)" class="btn">
                    Siguiente
                    <svg class="ic" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>

            <div class="record-actions-row">
                <button id="save-btn" onclick="saveCurrentRecordExplicit()" class="btn btn-gold">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                    Guardar
                </button>
                <button onclick="clearCurrentRecord()" class="btn btn-danger-outline">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
                    Limpiar
                </button>
                <button onclick="addNewRecord()" class="btn btn-ghost-gold">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Nuevo
                </button>
                <button onclick="deleteCurrentRecord()" class="btn btn-danger-solid">
                    <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>
                    Eliminar
                </button>
            </div>

            <div class="action-row">
                <button id="back-parent-btn" onclick="goBackToParent()" class="btn btn-ghost-gold" style="display:none;">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    Volver
                </button>
                <button onclick="showLauncher()" class="btn">
                    <svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                    Inicio
                </button>
                <button onclick="editCurrentFormStructure()" class="btn btn-danger-outline">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    Editar
                </button>
            </div>
        </section>

    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    // ============================================================
    // MODELO DE DATOS
    // Arranca vacío: el usuario define sus propios formularios,
    // para cualquier área (no solo construcción). Cada registro
    // tiene un _id único; los hijos guardan el _id exacto de su
    // registro padre (_parentId), no un valor de texto — así no
    // hay colisiones y se puede anidar a cualquier profundidad
    // (padre → hijo → nieto → bisnieto → …).
    // ============================================================

    let recordIdCounter = 1;
    function nextRecordId() { return recordIdCounter++; }

    let formsRegistry = [];
    let activeIndexByForm = {};
    let activeFormId = null;
    let editingFormId = null;
    let navStack = [];
    let viewMode = 'record'; // 'record' | 'table'

    // Id del registro que está EFECTIVAMENTE mostrado en los inputs
    // del DOM en este momento. Guardar siempre escribe sobre este
    // registro específico (buscado por _id), nunca sobre "el que sea
    // que el índice activo apunte ahora" — así, si el índice cambia
    // (por ejemplo al crear un registro nuevo) antes de que el DOM se
    // haya vuelto a dibujar, nunca se mezclan datos entre registros.
    let renderedRecordId = null;

    function findRecordById(formId, recordId) {
        const formObj = getForm(formId);
        if (!formObj || recordId === null || recordId === undefined) return null;
        return formObj.data.find(r => r._id === recordId) || null;
    }

    const DEPTH_COLORS = ['var(--depth-0)', 'var(--depth-1)', 'var(--depth-2)', 'var(--depth-3)'];

    function getForm(id) { return formsRegistry.find(f => f.id === id); }
    function getChildForms(formId) { return formsRegistry.filter(f => f.pivotFormId === formId); }

    function getDepth(formId) {
        let depth = 0;
        let form = getForm(formId);
        while (form && form.pivotFormId) {
            depth++;
            form = getForm(form.pivotFormId);
            if (depth > 20) break; // salvaguarda anti-loop
        }
        return depth;
    }

    function depthColor(depth) { return DEPTH_COLORS[depth % DEPTH_COLORS.length]; }

    function hasDescendants(formId) {
        return getChildForms(formId).length > 0;
    }

    // Un registro recién auto-creado para poder mostrar la tarjeta
    // (ver getActiveRecord más abajo) no cuenta como un registro
    // "real" hasta que tenga al menos un dato cargado. Se usa para
    // que los contadores (launcher, formularios relacionados) no
    // muestren "1" cuando en realidad no se ha ingresado nada.
    function recordHasData(formObj, record) {
        return formObj.fields.some(f => {
            const v = record[f.name];
            return v !== undefined && v !== '' && v !== false;
        });
    }

    function countFilledRecords(formObj, records) {
        return records.filter(r => recordHasData(formObj, r)).length;
    }

    // Un registro es exportable si tiene datos propios, o si aunque
    // esté vacío tiene descendientes (hijos, nietos, ...) con datos —
    // así no se pierden compras reales solo porque la obra a la que
    // pertenecen quedó con algún campo sin completar.
    function recordIsExportable(formId, record) {
        const formObj = getForm(formId);
        if (recordHasData(formObj, record)) return true;
        return getChildForms(formId).some(child =>
            child.data.some(r => r._parentId === record._id && recordIsExportable(child.id, r))
        );
    }

    // ============================================================
    // RESOLUCIÓN JERÁRQUICA
    // ============================================================

    function getVisibleRecords(formId) {
        const form = getForm(formId);
        if (!form.pivotFormId) return form.data;
        const parentRecord = getActiveRecord(form.pivotFormId);
        if (!parentRecord) return [];
        return form.data.filter(r => r._parentId === parentRecord._id);
    }

    function getActiveRecord(formId) {
        let list = getVisibleRecords(formId);

        if (list.length === 0) {
            const form = getForm(formId);
            let parentId = null;
            if (form.pivotFormId) {
                const parentRec = getActiveRecord(form.pivotFormId);
                if (!parentRec) return null;
                parentId = parentRec._id;
            }
            const rec = { _id: nextRecordId(), _parentId: parentId };
            form.data.push(rec);
            list = getVisibleRecords(formId);
            activeIndexByForm[formId] = 0;
        }

        let idx = activeIndexByForm[formId] || 0;
        if (idx >= list.length) idx = list.length - 1;
        if (idx < 0) idx = 0;
        activeIndexByForm[formId] = idx;

        return list[idx];
    }

    function resetDescendantIndices(formId) {
        getChildForms(formId).forEach(child => {
            activeIndexByForm[child.id] = 0;
            resetDescendantIndices(child.id);
        });
    }

    // ============================================================
    // LANZADOR
    // ============================================================

    function showLauncher() {
        saveCurrentRuntimeData();
        navStack = [];
        activeFormId = null;
        renderedRecordId = null;
        viewMode = 'record';
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('screen-launcher').classList.remove('hidden');
        renderLauncherList();
    }

    function renderLauncherList() {
        const listContainer = document.getElementById('launcher-list');
        const emptyState = document.getElementById('launcher-empty');
        listContainer.innerHTML = '';

        const hasExportable = formsRegistry.some(f => f.data.some(r => recordIsExportable(f.id, r)));
        document.getElementById('export-btn').style.display = hasExportable ? 'flex' : 'none';

        if (formsRegistry.length === 0) {
            emptyState.style.display = 'flex';
            return;
        }
        emptyState.style.display = 'none';

        // Solo los formularios raíz (sin padre) se listan como apps
        // ejecutables; los relacionados viven dentro del flujo del
        // registro padre y se editan desde aquí con un toque.
        formsRegistry.forEach((form) => {
            const isRoot = !form.pivotFormId;
            const depth = getDepth(form.id);
            const stack = hasDescendants(form.id);

            const card = document.createElement('div');
            card.className = `app-icon-card ${stack ? 'has-stack' : ''}`;

            const iconSvg = isRoot
                ? `<svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--gold);"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`
                : `<svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--text-dim);"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;

            const metaText = isRoot
                ? `${countFilledRecords(form, form.data)} registro${countFilledRecords(form, form.data) === 1 ? '' : 's'}`
                : `parte de <strong>${getForm(form.pivotFormId).title}</strong>`;

            card.innerHTML = `
                <span class="depth-dot" style="background:${depthColor(depth)};"></span>
                <div class="app-info">
                    <span class="app-title">${form.title}</span>
                    <span class="app-meta">${metaText}</span>
                </div>
                ${iconSvg}
            `;

            card.onclick = () => {
                if (isRoot) {
                    launchForm(form.id, { fromLauncher: true });
                } else {
                    editFormStructure(form.id);
                }
            };

            listContainer.appendChild(card);
        });
    }

    function startNewForm() {
        const newId = formsRegistry.length ? Math.max(...formsRegistry.map(f => f.id)) + 1 : 1;
        formsRegistry.push({
            id: newId,
            title: "",
            pivotFormId: null,
            pivotField: "",
            fields: [{ name: "", type: "text" }],
            data: []
        });
        editFormStructure(newId, { isNew: true });
    }

    // ============================================================
    // DISEÑADOR
    // ============================================================

    function editFormStructure(formId, opts) {
        opts = opts || {};
        editingFormId = formId;
        const formObj = getForm(formId);

        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('screen-builder').classList.remove('hidden');

        document.getElementById('builder-step-label').textContent = opts.isNew ? 'Nuevo' : 'Editar';
        document.getElementById('builder-heading').textContent = opts.isNew ? 'Definir formulario' : `Editar “${formObj.title || 'formulario'}”`;
        document.getElementById('form-title-input').value = formObj.title;

        const pivotSection = document.getElementById('pivot-section');
        const pivotSelect = document.getElementById('form-pivot-source');
        const subtitle = document.getElementById('builder-subtitle');

        const otherForms = formsRegistry.filter(f => f.id !== formObj.id);
        if (otherForms.length > 0) {
            pivotSection.style.display = 'block';
            subtitle.textContent = 'Dale un nombre, agrega los datos, y si corresponde, dile de qué formulario depende.';
            pivotSelect.innerHTML = `<option value="">No depende de otro — es un formulario principal</option>`;

            otherForms.forEach(pf => {
                pf.fields.forEach(f => {
                    if (!f.name) return;
                    const opt = document.createElement('option');
                    opt.value = `${pf.id}::${f.name}`;
                    opt.textContent = `${pf.title} → ${f.name}`;
                    if (formObj.pivotFormId == pf.id && formObj.pivotField == f.name) opt.selected = true;
                    pivotSelect.appendChild(opt);
                });
            });
        } else {
            pivotSection.style.display = 'none';
            subtitle.textContent = 'Este será tu primer formulario. Dale un nombre y agrega los datos que quieres registrar.';
        }

        renderBuilderFields();
    }

    function renderBuilderFields() {
        const formObj = getForm(editingFormId);
        const container = document.getElementById('builder-fields-container');
        container.innerHTML = '';

        formObj.fields.forEach((field, index) => {
            const row = document.createElement('div');
            row.className = 'field-builder-row';
            row.innerHTML = `
                <div class="row-inputs">
                    <input type="text" class="f-name" placeholder="Nombre del dato (ej. Nombre, Fecha, Monto)" value="${field.name}" data-index="${index}">
                    <select class="f-type" data-index="${index}">
                        <option value="text" ${field.type==='text'?'selected':''}>Texto</option>
                        <option value="number" ${field.type==='number'?'selected':''}>Número</option>
                        <option value="date" ${field.type==='date'?'selected':''}>Fecha</option>
                        <option value="email" ${field.type==='email'?'selected':''}>Email</option>
                        <option value="checkbox" ${field.type==='checkbox'?'selected':''}>Sí/No</option>
                    </select>
                </div>
                ${formObj.fields.length > 1 ? `<button type="button" class="btn btn-danger-outline btn-tiny" onclick="removeBuilderField(${index})" style="align-self:flex-start;">Quitar</button>` : ''}
            `;
            container.appendChild(row);
        });
    }

    function addBuilderField() {
        saveBuilderState();
        const formObj = getForm(editingFormId);
        formObj.fields.push({ name: "", type: 'text' });
        renderBuilderFields();
    }

    function removeBuilderField(index) {
        saveBuilderState();
        const formObj = getForm(editingFormId);
        formObj.fields.splice(index, 1);
        renderBuilderFields();
    }

    function saveBuilderState() {
        const formObj = getForm(editingFormId);
        if (!formObj) return;

        const titleInput = document.getElementById('form-title-input');
        if (titleInput) formObj.title = titleInput.value || 'Sin nombre';

        const pivotSelect = document.getElementById('form-pivot-source');
        if (pivotSelect && pivotSelect.value) {
            const parts = pivotSelect.value.split('::');
            const newPivotFormId = parseInt(parts[0]);
            if (newPivotFormId !== formObj.pivotFormId) formObj.data = [];
            formObj.pivotFormId = newPivotFormId;
            formObj.pivotField = parts[1];
        } else {
            if (formObj.pivotFormId !== null) formObj.data = [];
            formObj.pivotFormId = null;
            formObj.pivotField = "";
        }

        const container = document.getElementById('builder-fields-container');
        if (container) {
            container.querySelectorAll('.field-builder-row').forEach((row, index) => {
                const nameInput = row.querySelector('.f-name');
                const typeSelect = row.querySelector('.f-type');
                if (formObj.fields[index]) {
                    formObj.fields[index].name = nameInput.value || `Dato ${index + 1}`;
                    formObj.fields[index].type = typeSelect.value;
                }
            });
        }
    }

    function saveAndReturnLauncher() {
        saveBuilderState();
        showLauncher();
    }

    function editCurrentFormStructure() {
        saveCurrentRuntimeData();
        editFormStructure(activeFormId);
    }

    // ============================================================
    // RUNTIME
    // ============================================================

    function launchForm(formId, opts) {
        opts = opts || {};
        saveCurrentRuntimeData();

        if (opts.fromDrill && activeFormId) {
            navStack.push(activeFormId);
        } else if (opts.fromLauncher) {
            navStack = [];
        }

        activeFormId = formId;
        viewMode = 'record';
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('screen-runtime').classList.remove('hidden');
        renderRuntime();
    }

    function goBackToParent() {
        saveCurrentRuntimeData();
        const prevId = navStack.pop();
        if (prevId === undefined) { showLauncher(); return; }
        activeFormId = prevId;
        viewMode = 'record';
        renderRuntime();
    }

    function buildBreadcrumb() {
        const chain = [...navStack, activeFormId];
        return chain.map((id, i) => {
            const f = getForm(id);
            const depth = getDepth(id);
            const isLast = i === chain.length - 1;
            return `<span class="crumb ${isLast ? 'crumb-active' : ''}">
                <span class="depth-dot" style="background:${depthColor(depth)};"></span>${f.title}
            </span>${isLast ? '' : '<span>/</span>'}`;
        }).join('');
    }

    function renderRuntime() {
        // OJO: no se llama a saveCurrentRuntimeData() aquí. Cada acción
        // que transiciona de registro, de formulario o de pantalla ya
        // guarda explícitamente ANTES de llamar a renderRuntime(). Si
        // esta función guardara también, podría hacerlo usando el
        // índice/registro nuevo mientras el DOM todavía muestra los
        // valores del registro anterior, copiando datos entre registros.
        const formObj = getForm(activeFormId);

        document.getElementById('runtime-breadcrumb').innerHTML = buildBreadcrumb();
        document.getElementById('runtime-title').textContent = formObj.title;
        document.getElementById('runtime-depth-dot').style.background = depthColor(getDepth(formObj.id));

        document.getElementById('back-parent-btn').style.display = navStack.length > 0 ? 'flex' : 'none';

        let recordList = getVisibleRecords(formObj.id);
        if (recordList.length === 0) getActiveRecord(formObj.id);
        recordList = getVisibleRecords(formObj.id);

        let idx = activeIndexByForm[formObj.id] || 0;
        if (idx >= recordList.length) idx = recordList.length - 1;
        if (idx < 0) idx = 0;
        activeIndexByForm[formObj.id] = idx;

        const record = recordList[idx] || {};
        document.getElementById('record-indicator').textContent = `${recordList.length ? idx + 1 : 0} / ${recordList.length}`;

        // Alternador de vista tabla/registro: solo tiene sentido con 2+ registros
        const toggle = document.getElementById('view-toggle');
        if (recordList.length >= 2) {
            toggle.style.display = 'flex';
            toggle.querySelectorAll('.view-toggle-opt').forEach(el => {
                el.classList.toggle('active', el.dataset.mode === viewMode);
            });
        } else {
            toggle.style.display = 'none';
            viewMode = 'record';
        }

        const recordNavBar = document.getElementById('record-nav-bar');
        const cardEl = document.getElementById('runtime-card');
        const tableEl = document.getElementById('runtime-table');

        if (viewMode === 'table') {
            recordNavBar.style.display = 'none';
            cardEl.style.display = 'none';
            tableEl.style.display = 'block';
            renderRecordsTable(formObj, recordList, idx);
            renderedRecordId = null; // en vista tabla no hay un único registro "en edición"
        } else {
            recordNavBar.style.display = 'flex';
            cardEl.style.display = 'flex';
            tableEl.style.display = 'none';
            renderSingleRecordCard(formObj, record);
            renderedRecordId = record._id !== undefined ? record._id : null;
        }

        renderChildrenSection(formObj.id, record);
    }

    function renderSingleRecordCard(formObj, record) {
        const card = document.getElementById('runtime-card');
        let html = '';

        if (formObj.pivotFormId) {
            const parentForm = getForm(formObj.pivotFormId);
            const parentRecord = getActiveRecord(formObj.pivotFormId);
            const label = parentRecord ? (parentRecord[formObj.pivotField] || '(sin valor)') : '(sin registro padre)';
            html += `<div class="context-banner">Ligado a <strong>${parentForm.title}</strong> — ${formObj.pivotField}: <strong>${label}</strong></div>`;
        }

        formObj.fields.forEach(f => {
            const val = record[f.name] !== undefined ? record[f.name] : '';
            html += `<div class="form-field"><label class="field-label">${f.name}</label>`;
            if (f.type === 'checkbox') {
                html += `<input type="checkbox" class="r-input" data-name="${f.name}" ${val ? 'checked' : ''} style="width:auto;">`;
            } else {
                html += `<input type="${f.type}" class="r-input" data-name="${f.name}" value="${val}">`;
            }
            html += `</div>`;
        });

        card.innerHTML = html || `<p class="subtitle">Este formulario todavía no tiene datos definidos.</p>`;
    }

    function renderRecordsTable(formObj, recordList, activeIdx) {
        const tableEl = document.getElementById('runtime-table');
        const cols = formObj.fields;

        let html = `<div class="table-wrap"><table class="records-table"><thead><tr>`;
        cols.forEach(f => { html += `<th>${f.name}</th>`; });
        html += `</tr></thead><tbody>`;

        recordList.forEach((rec, i) => {
            html += `<tr class="table-row ${i === activeIdx ? 'table-row-active' : ''}" data-idx="${i}">`;
            cols.forEach(f => {
                let val = rec[f.name];
                if (f.type === 'checkbox') val = val ? '✓' : '—';
                else if (val === undefined || val === '') val = '—';
                html += `<td>${val}</td>`;
            });
            html += `</tr>`;
        });

        html += `</tbody></table></div>`;
        tableEl.innerHTML = html;

        tableEl.querySelectorAll('tr.table-row').forEach(row => {
            row.onclick = () => selectRecordFromTable(parseInt(row.dataset.idx));
        });
    }

    function setViewMode(mode) {
        viewMode = mode;
        renderRuntime();
    }

    function selectRecordFromTable(idx) {
        activeIndexByForm[activeFormId] = idx;
        resetDescendantIndices(activeFormId);
        viewMode = 'record';
        renderRuntime();
    }

    function renderChildrenSection(formId, currentRecord) {
        const section = document.getElementById('children-section');
        const list = document.getElementById('children-list');
        const children = getChildForms(formId);

        if (children.length === 0 || !currentRecord || currentRecord._id === undefined) {
            section.style.display = 'none';
            list.innerHTML = '';
            return;
        }

        section.style.display = 'block';
        list.innerHTML = '';

        children.forEach(child => {
            const childRecords = child.data.filter(r => r._parentId === currentRecord._id);
            const count = countFilledRecords(child, childRecords);
            const depth = getDepth(child.id);
            const row = document.createElement('div');
            row.className = 'thread-item';
            row.innerHTML = `
                <span class="thread-item-name">
                    <span class="depth-dot" style="background:${depthColor(depth)};"></span>
                    ${child.title}
                </span>
                <span class="thread-item-count">
                    ${count}
                    <svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px;"><path d="M9 18l6-6-6-6"/></svg>
                </span>
            `;
            row.onclick = () => launchForm(child.id, { fromDrill: true });
            list.appendChild(row);
        });
    }

    function saveCurrentRuntimeData() {
        if (!activeFormId || renderedRecordId === null) return;
        if (viewMode !== 'record') return; // en vista tabla no hay inputs que leer

        const inputs = document.querySelectorAll('#runtime-card .r-input');
        if (inputs.length === 0) return;

        // Se guarda SIEMPRE sobre el registro cuyo _id coincide con lo
        // que hay dibujado en el DOM ahora mismo — nunca sobre "el
        // registro que el índice activo apunte en este instante", que
        // puede haber cambiado ya (por ejemplo, justo después de crear
        // un registro nuevo).
        const currentRecord = findRecordById(activeFormId, renderedRecordId);
        if (!currentRecord) return;

        inputs.forEach(input => {
            currentRecord[input.dataset.name] = input.type === 'checkbox' ? input.checked : input.value;
        });
    }

    function saveCurrentRecordExplicit() {
        saveCurrentRuntimeData();
        const btn = document.getElementById('save-btn');
        if (!btn) return;
        const original = btn.innerHTML;
        btn.classList.add('btn-saved');
        btn.innerHTML = `<svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Guardado`;
        setTimeout(() => {
            btn.classList.remove('btn-saved');
            btn.innerHTML = original;
        }, 1100);
    }

    function clearCurrentRecord() {
        if (!activeFormId || renderedRecordId === null) return;
        const formObj = getForm(activeFormId);
        const currentRecord = findRecordById(activeFormId, renderedRecordId);
        if (!currentRecord) return;

        const hasData = formObj.fields.some(f => {
            const v = currentRecord[f.name];
            return v !== undefined && v !== '' && v !== false;
        });
        if (hasData && !confirm('¿Borrar los datos de este registro? Esta acción no se puede deshacer.')) return;

        formObj.fields.forEach(f => {
            currentRecord[f.name] = f.type === 'checkbox' ? false : '';
        });
        renderRuntime();
    }

    // ============================================================
    // ELIMINAR REGISTRO
    // Borra por completo el registro actual (no solo sus datos) y,
    // en cascada, todos sus descendientes (hijos, nietos, ...) para
    // no dejar registros huérfanos apuntando a un padre que ya no
    // existe.
    // ============================================================

    function deleteDescendantRecords(formId, recordId) {
        getChildForms(formId).forEach(child => {
            const toDelete = child.data.filter(r => r._parentId === recordId);
            toDelete.forEach(r => deleteDescendantRecords(child.id, r._id));
            child.data = child.data.filter(r => r._parentId !== recordId);
        });
    }

    function deleteCurrentRecord() {
        if (!activeFormId || renderedRecordId === null) return;
        const formObj = getForm(activeFormId);
        const currentRecord = findRecordById(activeFormId, renderedRecordId);
        if (!currentRecord) return;

        const childCount = getChildForms(activeFormId)
            .reduce((sum, child) => sum + countFilledRecords(child, child.data.filter(r => r._parentId === currentRecord._id)), 0);
        const warning = childCount > 0
            ? `Este registro tiene ${childCount} registro${childCount === 1 ? '' : 's'} relacionado${childCount === 1 ? '' : 's'} que también se eliminarán. ¿Continuar?`
            : '¿Eliminar este registro? Esta acción no se puede deshacer.';
        if (!confirm(warning)) return;

        deleteDescendantRecords(activeFormId, currentRecord._id);
        formObj.data = formObj.data.filter(r => r._id !== currentRecord._id);

        renderedRecordId = null;
        resetDescendantIndices(activeFormId);
        // renderRuntime() recorta el índice si quedó fuera de rango y,
        // si la lista quedó vacía, crea automáticamente un registro en
        // blanco (mismo comportamiento que ya existía para ese caso).
        renderRuntime();
    }

    function changeRecord(direction) {
        saveCurrentRuntimeData();
        const list = getVisibleRecords(activeFormId);
        let idx = (activeIndexByForm[activeFormId] || 0) + direction;
        if (idx < 0) idx = 0;
        if (idx >= list.length) idx = list.length - 1;
        activeIndexByForm[activeFormId] = idx;
        resetDescendantIndices(activeFormId);
        renderRuntime();
    }

    function addNewRecord() {
        // Guarda lo que hubiera en pantalla ANTES de crear el registro
        // nuevo, y solo después crea uno en blanco. renderRuntime() no
        // vuelve a guardar por su cuenta, así que el registro nuevo
        // siempre nace vacío, nunca con una copia del anterior.
        saveCurrentRuntimeData();
        const formObj = getForm(activeFormId);

        let parentId = null;
        if (formObj.pivotFormId) {
            const parentRecord = getActiveRecord(formObj.pivotFormId);
            if (!parentRecord) { return; }
            parentId = parentRecord._id;
        }

        const newRec = { _id: nextRecordId(), _parentId: parentId };
        formObj.data.push(newRec);

        const list = getVisibleRecords(formObj.id);
        activeIndexByForm[formObj.id] = list.length - 1;
        resetDescendantIndices(formObj.id);
        viewMode = 'record';
        renderRuntime();
    }

    // ============================================================
    // EXPORTAR DATOS
    // Un solo archivo .xlsx con una hoja por formulario. Los
    // formularios relacionados (con pivotFormId) agregan una primera
    // columna con un dato identificador del registro padre, para no
    // perder la relación aunque cada hoja sea una tabla plana.
    // ============================================================

    function formToRows(formObj) {
        const records = formObj.data.filter(r => recordIsExportable(formObj.id, r));

        let parentForm = null, parentLabelField = null;
        const headerRow = formObj.fields.map(f => f.name);

        if (formObj.pivotFormId) {
            parentForm = getForm(formObj.pivotFormId);
            parentLabelField = parentForm.fields[0] ? parentForm.fields[0].name : null;
            headerRow.unshift(`${parentForm.title}${parentLabelField ? ' (' + parentLabelField + ')' : ''}`);
        }

        const rows = [headerRow];

        records.forEach(r => {
            const row = formObj.fields.map(f => {
                let v = r[f.name];
                if (f.type === 'checkbox') v = v ? 'Sí' : 'No';
                return v === undefined ? '' : v;
            });
            if (parentForm) {
                const parentRec = findRecordById(parentForm.id, r._parentId);
                const label = parentRec && parentLabelField ? parentRec[parentLabelField] : '';
                row.unshift(label === undefined ? '' : label);
            }
            rows.push(row);
        });

        return rows;
    }

    // Los nombres de hoja en Excel no pueden pasar de 31 caracteres,
    // ni repetirse, ni usar : \ / ? * [ ]
    function sheetNameFor(formObj, usedNames) {
        let base = (formObj.title || `Formulario ${formObj.id}`)
            .replace(/[:\\/\?\*\[\]]/g, ' ')
            .trim()
            .slice(0, 31) || `Form${formObj.id}`;

        let name = base, n = 2;
        while (usedNames.has(name)) {
            const suffix = ` (${n++})`;
            name = base.slice(0, 31 - suffix.length) + suffix;
        }
        usedNames.add(name);
        return name;
    }

    function exportAllData() {
        const exportableForms = formsRegistry.filter(f => f.data.some(r => recordIsExportable(f.id, r)));
        if (exportableForms.length === 0) return;

        const wb = XLSX.utils.book_new();
        const usedNames = new Set();

        exportableForms.forEach(formObj => {
            const rows = formToRows(formObj);
            const ws = XLSX.utils.aoa_to_sheet(rows);

            // Ancho de columna aproximado según el contenido, para que
            // no queden todas las columnas apretadas al ancho mínimo.
            ws['!cols'] = rows[0].map((_, colIdx) => {
                const maxLen = rows.reduce((m, r) => Math.max(m, String(r[colIdx] ?? '').length), 8);
                return { wch: Math.min(Math.max(maxLen + 2, 10), 40) };
            });

            XLSX.utils.book_append_sheet(wb, ws, sheetNameFor(formObj, usedNames));
        });

        const today = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `DataForge_export_${today}.xlsx`);
    }

    showLauncher();
</script>
