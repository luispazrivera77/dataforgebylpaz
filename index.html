<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataForge — Constructor de formularios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-app: #030508;
        --bg-screen: #070a10;
        --surface: #0f141f;
        --surface-2: #161c2b;
        --surface-hover: #1e2538;
        --border: #1e2638;
        --border-gold: rgba(217, 166, 83, 0.3);
        --text: #f4f2ec;
        --text-dim: #8b90a3;
        --text-faint: #565b6e;

        --gold: #d9a653;
        --gold-hover: #e6ba71;
        --gold-soft: rgba(217, 166, 83, 0.12);

        --danger: #e2685f;
        --success: #4fb08a;

        --depth-0: #4fb3ac;
        --depth-1: #d9a653;
        --depth-2: #c97fa0;
        --depth-3: #8c86d9;

        --font-display: 'Fraunces', Georgia, serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
        --font-body: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: var(--font-body);
        background: var(--bg-app);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        background-image: 
            linear-gradient(to right, rgba(217, 166, 83, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(217, 166, 83, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
    }

    .app-container {
        width: 100%;
        max-width: 680px;
        min-height: 100vh;
        background: var(--bg-screen);
        border-left: 1px solid var(--border-gold);
        border-right: 1px solid var(--border-gold);
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(217, 166, 83, 0.02);
    }

    @media (min-width: 700px) {
        .app-container {
            min-height: 85vh;
            max-height: 90vh;
            border-radius: 16px;
            border: 1px solid var(--border-gold);
            overflow: hidden;
        }
    }

    .screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 32px 36px 24px 36px;
        box-sizing: border-box;
        overflow-y: auto;
        min-height: 0;
    }

    .screen.hidden { display: none; }

    .brand-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
    }

    .brand {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 22px;
        letter-spacing: -0.01em;
        color: var(--text);
    }

    .brand small {
        font-family: var(--font-mono);
        font-size: 9.5px;
        color: var(--gold);
        display: block;
        letter-spacing: 0.15em;
        margin-top: 3px;
        font-weight: 500;
    }

    h2 {
        font-family: var(--font-display);
        font-size: 20px;
        margin: 0 0 6px 0;
        font-weight: 600;
    }

    .subtitle {
        font-size: 13px;
        color: var(--text-dim);
        margin: 0 0 20px 0;
        line-height: 1.5;
    }

    label.field-label {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--gold);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: block;
        margin-bottom: 6px;
    }

    input, select {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
        font-family: var(--font-body);
        outline: none;
        width: 100%;
        transition: 0.2s;
    }

    input:focus, select:focus { 
        border-color: var(--gold); 
        box-shadow: 0 0 0 3px var(--gold-soft); 
        background: var(--surface-2);
    }
    input::placeholder { color: var(--text-faint); }

    .builder-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 280px;
        overflow-y: auto;
        margin-bottom: 4px;
        padding-right: 4px;
    }

    .field-builder-row {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .row-inputs { display: flex; gap: 10px; }
    .row-inputs input { flex: 1.4; }
    .row-inputs select { flex: 1; }

    .btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 11px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13.5px;
        font-family: var(--font-body);
        font-weight: 500;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s;
    }

    .btn:hover { background: var(--surface-hover); border-color: var(--border-gold); }
    .btn-icon-only { padding: 9px; }
    .btn-gold { background: var(--gold); border: none; color: #0a0d14; font-weight: 600; }
    .btn-gold:hover { background: var(--gold-hover); box-shadow: 0 0 15px rgba(217, 166, 83, 0.25); }
    .btn-ghost-gold { border-color: var(--border-gold); color: var(--gold); }
    .btn-ghost-gold:hover { background: var(--gold-soft); border-color: var(--gold); }
    .btn-success { background: var(--success); border: none; color: #03140f; font-weight: 600; }
    .btn-danger-outline { color: var(--danger); border-color: rgba(226,104,95,0.3); }
    .btn-danger-outline:hover { background: rgba(226,104,95,0.1); }
    .btn-danger-solid { background: var(--danger); border: none; color: #1a0504; font-weight: 600; }
    .btn-danger-solid:hover { background: #ea8078; }
    .btn-tiny { padding: 6px 12px; font-size: 11px; border-radius: 8px; }

    svg.ic { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
        padding: 30px;
    }

    .empty-state .ring {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 1px dashed var(--border-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold);
        background: var(--gold-soft);
    }

    .empty-state h3 {
        font-family: var(--font-display);
        font-size: 18px;
        margin: 0;
        font-weight: 600;
    }

    .empty-state p {
        font-size: 13px;
        color: var(--text-dim);
        margin: 0;
        max-width: 300px;
        line-height: 1.6;
    }

    .app-launcher-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
    }

    .app-icon-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 15px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        transition: 0.2s;
        position: relative;
    }

    .app-icon-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 12px;
        background: linear-gradient(90deg, var(--gold-soft), transparent);
        opacity: 0;
        transition: 0.2s;
        z-index: 0;
    }

    .app-icon-card.has-stack::before { opacity: 0.5; }
    .app-icon-card > * { position: relative; z-index: 1; }
    .app-icon-card:hover { border-color: var(--border-gold); background: var(--surface-hover); transform: translateY(-1px); }

    .depth-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 8px currentColor;
    }

    .app-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .app-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
    .app-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em; }
    .app-meta strong { color: var(--gold); }

    .breadcrumb {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-faint);
        margin-bottom: 14px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
    }

    .crumb { display: flex; align-items: center; gap: 6px; }
    .crumb .depth-dot { width: 7px; height: 7px; }
    .crumb.crumb-active { color: var(--text); font-weight: 600; }

    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
    }

    .form-header-title { display: flex; align-items: center; gap: 10px; }
    .form-header-title .depth-dot { width: 9px; height: 9px; }
    #runtime-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--text); }
    #record-indicator { font-family: var(--font-mono); font-size: 11.5px; color: var(--gold); background: var(--gold-soft); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border-gold); }

    .runtime-scroll { flex: 1; overflow-y: auto; min-height: 0; padding-right: 4px; }

    .form-card { display: flex; flex-direction: column; gap: 15px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }

    .context-banner {
        background: var(--surface-2);
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 12.5px;
        color: var(--text-dim);
        border-left: 3px solid var(--gold);
        margin-bottom: 16px;
        line-height: 1.5;
        border: 1px solid var(--border);
        border-left-width: 3px;
    }

    .context-banner strong { color: var(--gold); font-weight: 600; }

    .thread {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        position: relative;
    }

    .thread-label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 12px;
    }

    .thread-list { position: relative; padding-left: 16px; }

    .thread-list::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 8px;
        bottom: 8px;
        width: 1px;
        background: linear-gradient(to bottom, var(--gold), var(--border));
    }

    .thread-item {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 9px;
        cursor: pointer;
        transition: 0.2s;
    }

    .thread-item::before {
        content: "";
        position: absolute;
        left: -16px;
        top: 50%;
        transform: translateY(-50%);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 6px var(--gold);
    }

    .thread-item:hover { border-color: var(--border-gold); background: var(--surface-hover); transform: translateX(2px); }
    .thread-item-name { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 500; }
    .thread-item-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); }

    .nav-bar {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding-top: 16px;
        margin-top: 12px;
        border-top: 1px solid var(--border);
    }

    .nav-bar .btn { flex: 1; }

    .record-actions-row { display: flex; gap: 8px; margin-top: 10px; }
    .record-actions-row .btn { flex: 1; font-size: 11px; padding: 10px 6px; }

    .action-row { display: flex; gap: 8px; margin-top: 10px; }
    .action-row .btn { flex: 1; font-size: 12px; }

    .btn-saved {
        background: var(--success) !important;
        border-color: var(--success) !important;
        color: #03140f !important;
    }

    .view-toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-dim);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px;
        cursor: pointer;
    }

    .view-toggle-opt {
        padding: 5px 10px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: 0.2s;
    }

    .view-toggle-opt.active { background: var(--gold); color: #0a0d14; font-weight: 600; box-shadow: 0 0 10px rgba(217, 166, 83, 0.3); }

    .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        max-height: 380px;
    }

    table.records-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
    }

    table.records-table th {
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--gold);
        text-align: left;
        padding: 11px 12px;
        background: var(--surface-2);
        white-space: nowrap;
        position: sticky;
        top: 0;
        border-bottom: 1px solid var(--border-gold);
    }

    table.records-table td {
        padding: 11px 12px;
        border-top: 1px solid var(--border);
        white-space: nowrap;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
    }

    table.records-table tr.table-row { cursor: pointer; transition: 0.15s; }
    table.records-table tr.table-row:hover td { background: var(--surface-hover); }
    table.records-table tr.table-row-active td { background: var(--gold-soft); }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 14px;
    }

    .pill {
        font-family: var(--font-mono);
        font-size: 10px;
        padding: 4px 10px;
        border-radius: 20px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .gold-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
        margin: 16px 0;
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- Lanzador -->
    <section id="screen-launcher" class="screen">
        <div class="brand-row">
            <div class="brand">DataForge<small>CONSTRUCTOR DE DATOS</small></div>
            <div style="display:flex; gap:8px;">
                <input type="file" id="import-file-input" accept=".xlsx, .xls" style="display:none;" onchange="importExcelData(event)">
                
                <button onclick="document.getElementById('import-file-input').click()" class="btn btn-ghost-gold btn-icon-only" title="Cargar desde Excel">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 21v-11"/><path d="M7.5 13.5 12 9l4.5 4.5"/><path d="M5 3h14"/></svg>
                </button>
                <button id="export-btn" onclick="exportAllData()" class="btn btn-ghost-gold btn-icon-only" title="Exportar a Excel" style="display:none;">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 21h14"/></svg>
                </button>
                <button onclick="startNewForm()" class="btn btn-gold" title="Crear formulario">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Nuevo formulario
                </button>
            </div>
        </div>

        <div id="launcher-empty" class="empty-state" style="display:none;">
            <div class="ring">
                <svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px;"><path d="M12 5v14M5 12h14"/></svg>
            </div>
            <h3>Crea tu primer formulario</h3>
            <p>Puede ser cualquier cosa: clientes, pacientes, pedidos, inventario. Empieza por el dato principal de tu proceso.</p>
            <div style="display:flex; gap:10px; margin-top: 6px;">
                <button onclick="startNewForm()" class="btn btn-gold">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Crear formulario
                </button>
                <button onclick="document.getElementById('import-file-input').click()" class="btn btn-ghost-gold">
                    <svg class="ic" viewBox="0 0 24 24"><path d="M12 21v-11"/><path d="M7.5 13.5 12 9l4.5 4.5"/><path d="M5 3h14"/></svg>
                    Cargar Excel
                </button>
            </div>
        </div>

        <div id="launcher-list" class="app-launcher-grid"></div>
    </section>

    <!-- Diseñador -->
    <section id="screen-builder" class="screen hidden">
        <div class="top-bar">
            <span id="builder-step-label" class="pill" style="background:var(--gold-soft); color:var(--gold); border: 1px solid var(--border-gold);">Nuevo</span>
            <button onclick="showLauncher()" class="btn btn-tiny btn-ghost-gold">
                <svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                Inicio
            </button>
        </div>

        <h2 id="builder-heading">Definir formulario</h2>
        <p class="subtitle" id="builder-subtitle">Dale un nombre y agrega los datos que quieres registrar.</p>

        <div style="margin-bottom: 16px;">
            <label class="field-label">Nombre del formulario</label>
            <input type="text" id="form-title-input" placeholder="Ej. Clientes, Pedidos, Pacientes…">
        </div>

        <div id="pivot-section" style="margin-bottom: 16px; display: none;">
            <label class="field-label">Depende de (Relación Padre)</label>
            <select id="form-pivot-source">
                <option value="">No depende de otro — es un formulario principal</option>
            </select>
        </div>

        <label class="field-label">Campos de datos</label>
        <div id="builder-fields-container" class="builder-container"></div>

        <div class="gold-divider"></div>

        <!-- Botones de acción del diseñador (Agregar campo, Cancelar y Guardar) -->
        <div style="display: flex; gap: 10px; margin-top: 4px;">
            <button type="button" onclick="addBuilderField()" class="btn btn-ghost-gold" style="flex: 1;">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Agregar campo
            </button>
            <button type="button" onclick="showLauncher()" class="btn" style="flex: 1;">
                Cancelar
            </button>
            <button type="button" onclick="saveAndReturnLauncher()" class="btn btn-success" style="flex: 1;">
                Guardar formulario
            </button>
        </div>

        <!-- Botón destacado y claramente visible para eliminar el formulario completo -->
        <div style="margin-top: 12px; display: flex;">
            <button type="button" onclick="deleteEntireForm()" class="btn btn-danger-outline" style="width: 100%;">
                <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>
                Eliminar formulario completo
            </button>
        </div>
    </section>

    <!-- Runtime -->
    <section id="screen-runtime" class="screen hidden">
        <div id="runtime-breadcrumb" class="breadcrumb"></div>

        <div class="form-header">
            <div class="form-header-title">
                <span id="runtime-depth-dot" class="depth-dot"></span>
                <strong id="runtime-title">Formulario</strong>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="record-indicator">1 / 1</span>
                <div id="view-toggle" class="view-toggle">
                    <span class="view-toggle-opt" data-mode="record" onclick="setViewMode('record')">
                        <svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px;"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                    </span>
                    <span class="view-toggle-opt" data-mode="table" onclick="setViewMode('table')">
                        <svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px;"><path d="M3 9h18M3 15h18M9 3v18"/></svg>
                    </span>
                </div>
            </div>
        </div>

        <div class="runtime-scroll">
            <div id="runtime-card" class="form-card" style="display:none;"></div>
            <div id="runtime-table"></div>
            <div id="children-section" class="thread" style="display:none;">
                <div class="thread-label">Formularios relacionados</div>
                <div id="children-list" class="thread-list"></div>
            </div>
        </div>

        <div id="record-nav-bar" class="nav-bar" style="display:none;">
            <button onclick="changeRecord(-1)" class="btn">
                <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                Anterior
            </button>
            <button onclick="changeRecord(1)" class="btn">
                Siguiente
                <svg class="ic" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>

        <div class="record-actions-row">
            <button id="save-btn" onclick="saveCurrentRecordExplicit()" class="btn btn-gold">
                <svg class="ic" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                Guardar
            </button>
            <button onclick="clearCurrentRecord()" class="btn btn-danger-outline">
                <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
                Limpiar
            </button>
            <button onclick="addNewRecord()" class="btn btn-ghost-gold">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Nuevo
            </button>
            <button onclick="deleteCurrentRecord()" class="btn btn-danger-solid">
                <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>
                Eliminar
            </button>
        </div>

        <div class="action-row">
            <button id="back-parent-btn" onclick="goBackToParent()" class="btn btn-ghost-gold" style="display:none;">
                <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                Volver
            </button>
            <button onclick="showLauncher()" class="btn">
                <svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                Inicio
            </button>
            <button onclick="editCurrentFormStructure()" class="btn btn-danger-outline">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                Editar
            </button>
        </div>
    </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    let recordIdCounter = 1;
    function nextRecordId() { return recordIdCounter++; }

    let formsRegistry = [];
    let activeIndexByForm = {};
    let activeFormId = null;
    let editingFormId = null;
    let navStack = [];
    let viewMode = 'table';
    let renderedRecordId = null;

    function findRecordById(formId, recordId) {
        const formObj = getForm(formId);
        if (!formObj || recordId === null || recordId === undefined) return null;
        return formObj.data.find(r => r._id === recordId) || null;
    }

    const DEPTH_COLORS = ['var(--depth-0)', 'var(--depth-1)', 'var(--depth-2)', 'var(--depth-3)'];

    function getForm(id) { return formsRegistry.find(f => f.id === id); }
    function getChildForms(formId) { return formsRegistry.filter(f => f.pivotFormId === formId); }

    function getDepth(formId) {
        let depth = 0;
        let form = getForm(formId);
        while (form && form.pivotFormId) {
            depth++;
            form = getForm(form.pivotFormId);
            if (depth > 20) break;
        }
        return depth;
    }

    function depthColor(depth) { return DEPTH_COLORS[depth % DEPTH_COLORS.length]; }
    function hasDescendants(formId) { return getChildForms(formId).length > 0; }

    function recordHasData(formObj, record) {
        return formObj.fields.some(f => {
            const v = record[f.name];
            return v !== undefined && v !== '' && v !== false;
        });
    }

    function countFilledRecords(formObj, records) {
        return records.filter(r => recordHasData(formObj, r)).length;
    }

    function recordIsExportable(formId, record) {
        const formObj = getForm(formId);
        if (recordHasData(formObj, record)) return true;
        return getChildForms(formId).some(child =>
            child.data.some(r => r._parentId === record._id && recordIsExportable(child.id, r))
        );
    }

    function getVisibleRecords(formId) {
        const form = getForm(formId);
        if (!form.pivotFormId) return form.data;
        const parentRecord = getActiveRecord(form.pivotFormId);
        if (!parentRecord) return [];
        return form.data.filter(r => r._parentId === parentRecord._id);
    }

    function getActiveRecord(formId) {
        let list = getVisibleRecords(formId);

        if (list.length === 0) {
            const form = getForm(formId);
            let parentId = null;
            if (form.pivotFormId) {
                const parentRec = getActiveRecord(form.pivotFormId);
                if (!parentRec) return null;
                parentId = parentRec._id;
            }
            const rec = { _id: nextRecordId(), _parentId: parentId };
            form.data.push(rec);
            list = getVisibleRecords(formId);
            activeIndexByForm[formId] = 0;
        }

        let idx = activeIndexByForm[formId] || 0;
        if (idx >= list.length) idx = list.length - 1;
        if (idx < 0) idx = 0;
        activeIndexByForm[formId] = idx;

        return list[idx];
    }

    function resetDescendantIndices(formId) {
        getChildForms(formId).forEach(child => {
            activeIndexByForm[child.id] = 0;
            resetDescendantIndices(child.id);
        });
    }

    function showLauncher() {
        saveCurrentRuntimeData();
        navStack = [];
        activeFormId = null;
        renderedRecordId = null;
        viewMode = 'table';
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('screen-launcher').classList.remove('hidden');
        renderLauncherList();
    }

    function renderLauncherList() {
        const listContainer = document.getElementById('launcher-list');
        const emptyState = document.getElementById('launcher-empty');
        listContainer.innerHTML = '';

        const hasExportable = formsRegistry.some(f => f.data.some(r => recordIsExportable(f.id, r)));
        document.getElementById('export-btn').style.display = hasExportable ? 'flex' : 'none';

        if (formsRegistry.length === 0) {
            emptyState.style.display = 'flex';
            return;
        }
        emptyState.style.display = 'none';

        formsRegistry.forEach((form) => {
            const depth = getDepth(form.id);
            const stack = hasDescendants(form.id);

            const card = document.createElement('div');
            card.className = `app-icon-card ${stack ? 'has-stack' : ''}`;

            const iconSvg = `<svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--gold);"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;

            const metaText = !form.pivotFormId
                ? `${countFilledRecords(form, form.data)} registro${countFilledRecords(form, form.data) === 1 ? '' : 's'}`
                : `depende de <strong>${getForm(form.pivotFormId).title}</strong>`;

            card.innerHTML = `
                <span class="depth-dot" style="background:${depthColor(depth)};"></span>
                <div class="app-info">
                    <span class="app-title">${form.title}</span>
                    <span class="app-meta">${metaText}</span>
                </div>
                ${iconSvg}
            `;

            card.onclick = () => {
                saveCurrentRuntimeData();
                navStack = [];
                
                let curr = form;
                let parentsPath = [];
                while (curr && curr.pivotFormId) {
                    parentsPath.unshift(curr.pivotFormId);
                    curr = getForm(curr.pivotFormId);
                }
                navStack = parentsPath;

                activeFormId = form.id;
                viewMode = 'table';
                document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
                document.getElementById('screen-runtime').classList.remove('hidden');
                renderRuntime();
            };

            listContainer.appendChild(card);
        });
    }

    function startNewForm() {
        const newId = formsRegistry.length ? Math.max(...formsRegistry.map(f => f.id)) + 1 : 1;
        formsRegistry.push({
            id: newId,
            title: "",
            pivotFormId: null,
            pivotField: "",
            fields: [{ name: "", type: "text" }],
            data: []
        });
        editFormStructure(newId, { isNew: true });
    }

    function editFormStructure(formId, opts) {
        opts = opts || {};
        editingFormId = formId;
        const formObj = getForm(formId);

        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('screen-builder').classList.remove('hidden');

        document.getElementById('builder-step-label').textContent = opts.isNew ? 'Nuevo' : 'Editar';
        document.getElementById('builder-heading').textContent = opts.isNew ? 'Definir formulario' : `Editar “${formObj.title || 'formulario'}”`;
        document.getElementById('form-title-input').value = formObj.title;

        const pivotSection = document.getElementById('pivot-section');
        const pivotSelect = document.getElementById('form-pivot-source');
        const subtitle = document.getElementById('builder-subtitle');

        const otherForms = formsRegistry.filter(f => f.id !== formObj.id);
        if (otherForms.length > 0) {
            pivotSection.style.display = 'block';
            subtitle.textContent = 'Dale un nombre, agrega los datos, y si corresponde, dile de qué formulario depende.';
            pivotSelect.innerHTML = `<option value="">No depende de otro — es un formulario principal</option>`;

            otherForms.forEach(pf => {
                pf.fields.forEach(f => {
                    if (!f.name) return;
                    const opt = document.createElement('option');
                    opt.value = `${pf.id}::${f.name}`;
                    opt.textContent = `${pf.title} → ${f.name}`;
                    if (formObj.pivotFormId == pf.id && formObj.pivotField == f.name) opt.selected = true;
                    pivotSelect.appendChild(opt);
                });
            });
        } else {
            pivotSection.style.display = 'none';
            subtitle.textContent = 'Este será tu primer formulario. Dale un nombre y agrega los datos que quieres registrar.';
        }

        renderBuilderFields();
    }

    function renderBuilderFields() {
        const formObj = getForm(editingFormId);
        const container = document.getElementById('builder-fields-container');
        container.innerHTML = '';

        formObj.fields.forEach((field, index) => {
            const row = document.createElement('div');
            row.className = 'field-builder-row';
            row.innerHTML = `
                <div class="row-inputs">
                    <input type="text" class="f-name" placeholder="Nombre del dato (ej. Nombre, Fecha, Monto)" value="${field.name}" data-index="${index}">
                    <select class="f-type" data-index="${index}">
                        <option value="text" ${field.type==='text'?'selected':''}>Texto</option>
                        <option value="number" ${field.type==='number'?'selected':''}>Número</option>
                        <option value="date" ${field.type==='date'?'selected':''}>Fecha</option>
                        <option value="email" ${field.type==='email'?'selected':''}>Email</option>
                        <option value="checkbox" ${field.type==='checkbox'?'selected':''}>Sí/No</option>
                    </select>
                </div>
                ${formObj.fields.length > 1 ? `<button type="button" class="btn btn-danger-outline btn-tiny" onclick="removeBuilderField(${index})" style="align-self:flex-start;">Quitar</button>` : ''}
            `;
            container.appendChild(row);
        });
    }

    function addBuilderField() {
        saveBuilderState();
        const formObj = getForm(editingFormId);
        formObj.fields.push({ name: "", type: 'text' });
        renderBuilderFields();
    }

    function removeBuilderField(index) {
        saveBuilderState();
        const formObj = getForm(editingFormId);
        formObj.fields.splice(index, 1);
        renderBuilderFields();
    }

    function saveBuilderState() {
        const formObj = getForm(editingFormId);
        if (!formObj) return;

        const titleInput = document.getElementById('form-title-input');
        if (titleInput) formObj.title = titleInput.value || 'Sin nombre';

        const pivotSelect = document.getElementById('form-pivot-source');
        if (pivotSelect && pivotSelect.value) {
            const parts = pivotSelect.value.split('::');
            const newPivotFormId = parseInt(parts[0]);
            if (newPivotFormId !== formObj.pivotFormId) formObj.data = [];
            formObj.pivotFormId = newPivotFormId;
            formObj.pivotField = parts[1];
        } else {
            if (formObj.pivotFormId !== null) formObj.data = [];
            formObj.pivotFormId = null;
            formObj.pivotField = "";
        }

        const container = document.getElementById('builder-fields-container');
        if (container) {
            container.querySelectorAll('.field-builder-row').forEach((row, index) => {
                const nameInput = row.querySelector('.f-name');
                const typeSelect = row.querySelector('.f-type');
                if (formObj.fields[index]) {
                    formObj.fields[index].name = nameInput.value || `Dato ${index + 1}`;
                    formObj.fields[index].type = typeSelect.value;
                }
            });
        }
    }

    function saveAndReturnLauncher() {
        saveBuilderState();
        showLauncher();
    }

    function deleteEntireForm() {
        if (!editingFormId) return;
        const formObj = getForm(editingFormId);
        if (!formObj) return;

        function getAllSubFormIds(parentId) {
            let ids = [];
            let children = formsRegistry.filter(f => f.pivotFormId === parentId);
            children.forEach(child => {
                ids.push(child.id);
                ids = ids.concat(getAllSubFormIds(child.id));
            });
            return ids;
        }

        const subFormIds = getAllSubFormIds(formObj.id);
        const totalFormsToDelete = [formObj.id, ...subFormIds];

        const warningMsg = totalFormsToDelete.length > 1
            ? `¿Estás seguro de eliminar el formulario "${formObj.title}" y sus ${subFormIds.length} formularios dependientes asociados? Esta acción borrará toda su estructura y datos permanentemente.`
            : `¿Estás seguro de eliminar el formulario "${formObj.title}"? Esta acción no se puede deshacer.`;

        if (!confirm(warningMsg)) return;

        formsRegistry = formsRegistry.filter(f => !totalFormsToDelete.includes(f.id));
        editingFormId = null;
        showLauncher();
    }

    function editCurrentFormStructure() {
        saveCurrentRuntimeData();
        editFormStructure(activeFormId);
    }

    function launchForm(formId, opts) {
        opts = opts || {};
        saveCurrentRuntimeData();

        if (opts.fromDrill && activeFormId) {
            navStack.push(activeFormId);
        } else if (opts.fromLauncher) {
            navStack = [];
        }

        activeFormId = formId;
        viewMode = 'table';
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('screen-runtime').classList.remove('hidden');
        renderRuntime();
    }

    function goBackToParent() {
        saveCurrentRuntimeData();
        const prevId = navStack.pop();
        if (prevId === undefined) { showLauncher(); return; }
        activeFormId = prevId;
        viewMode = 'table';
        renderRuntime();
    }

    function buildBreadcrumb() {
        const chain = [...navStack, activeFormId];
        return chain.map((id, i) => {
            const f = getForm(id);
            const depth = getDepth(id);
            const isLast = i === chain.length - 1;
            return `<span class="crumb ${isLast ? 'crumb-active' : ''}">
                <span class="depth-dot" style="background:${depthColor(depth)};"></span>${f.title}
            </span>${isLast ? '' : '<span>/</span>'}`;
        }).join('');
    }

    function renderRuntime() {
        const formObj = getForm(activeFormId);

        document.getElementById('runtime-breadcrumb').innerHTML = buildBreadcrumb();
        document.getElementById('runtime-title').textContent = formObj.title;
        document.getElementById('runtime-depth-dot').style.background = depthColor(getDepth(formObj.id));

        document.getElementById('back-parent-btn').style.display = navStack.length > 0 ? 'flex' : 'none';

        let recordList = getVisibleRecords(formObj.id);
        if (recordList.length === 0) getActiveRecord(formObj.id);
        recordList = getVisibleRecords(formObj.id);

        let idx = activeIndexByForm[formObj.id] || 0;
        if (idx >= recordList.length) idx = recordList.length - 1;
        if (idx < 0) idx = 0;
        activeIndexByForm[formObj.id] = idx;

        const record = recordList[idx] || {};
        document.getElementById('record-indicator').textContent = `${recordList.length ? idx + 1 : 0} / ${recordList.length}`;

        const toggle = document.getElementById('view-toggle');
        toggle.querySelectorAll('.view-toggle-opt').forEach(el => {
            el.classList.toggle('active', el.dataset.mode === viewMode);
        });

        const recordNavBar = document.getElementById('record-nav-bar');
        const cardEl = document.getElementById('runtime-card');
        const tableEl = document.getElementById('runtime-table');

        if (viewMode === 'table') {
            recordNavBar.style.display = 'none';
            cardEl.style.display = 'none';
            tableEl.style.display = 'block';
            renderRecordsTable(formObj, recordList, idx);
            renderedRecordId = null;
        } else {
            recordNavBar.style.display = 'flex';
            cardEl.style.display = 'flex';
            tableEl.style.display = 'none';
            renderSingleRecordCard(formObj, record);
            renderedRecordId = record._id !== undefined ? record._id : null;
        }

        renderChildrenSection(formObj.id, record);
    }

    function renderSingleRecordCard(formObj, record) {
        const card = document.getElementById('runtime-card');
        let html = '';

        if (formObj.pivotFormId) {
            const parentForm = getForm(formObj.pivotFormId);
            const parentRecord = getActiveRecord(formObj.pivotFormId);
            const label = parentRecord ? (parentRecord[formObj.pivotField] || '(sin valor)') : '(sin registro padre)';
            html += `<div class="context-banner">Ligado a <strong>${parentForm.title}</strong> — ${formObj.pivotField}: <strong>${label}</strong></div>`;
        }

        formObj.fields.forEach(f => {
            const val = record[f.name] !== undefined ? record[f.name] : '';
            html += `<div class="form-field"><label class="field-label">${f.name}</label>`;
            if (f.type === 'checkbox') {
                html += `<input type="checkbox" class="r-input" data-name="${f.name}" ${val ? 'checked' : ''} style="width:auto;">`;
            } else {
                html += `<input type="${f.type}" class="r-input" data-name="${f.name}" value="${val}">`;
            }
            html += `</div>`;
        });

        card.innerHTML = html || `<p class="subtitle">Este formulario todavía no tiene datos definidos.</p>`;
    }

    function renderRecordsTable(formObj, recordList, activeIdx) {
        const tableEl = document.getElementById('runtime-table');
        const cols = formObj.fields;

        let html = `<div class="table-wrap"><table class="records-table"><thead><tr>`;
        cols.forEach(f => { html += `<th>${f.name}</th>`; });
        html += `</tr></thead><tbody>`;

        recordList.forEach((rec, i) => {
            html += `<tr class="table-row ${i === activeIdx ? 'table-row-active' : ''}" data-idx="${i}">`;
            cols.forEach(f => {
                let val = rec[f.name];
                if (f.type === 'checkbox') val = val ? '✓' : '—';
                else if (val === undefined || val === '') val = '—';
                html += `<td>${val}</td>`;
            });
            html += `</tr>`;
        });

        html += `</tbody></table></div>`;
        tableEl.innerHTML = html;

        tableEl.querySelectorAll('tr.table-row').forEach(row => {
            row.onclick = () => selectRecordFromTable(parseInt(row.dataset.idx));
        });
    }

    function setViewMode(mode) {
        saveCurrentRuntimeData();
        viewMode = mode;
        renderRuntime();
    }

    function selectRecordFromTable(idx) {
        activeIndexByForm[activeFormId] = idx;
        resetDescendantIndices(activeFormId);
        viewMode = 'record';
        renderRuntime();
    }

    function renderChildrenSection(formId, currentRecord) {
        const section = document.getElementById('children-section');
        const list = document.getElementById('children-list');
        const children = getChildForms(formId);

        if (children.length === 0 || !currentRecord || currentRecord._id === undefined) {
            section.style.display = 'none';
            list.innerHTML = '';
            return;
        }

        section.style.display = 'block';
        list.innerHTML = '';

        children.forEach(child => {
            const childRecords = child.data.filter(r => r._parentId === currentRecord._id);
            const count = countFilledRecords(child, childRecords);
            const depth = getDepth(child.id);
            const row = document.createElement('div');
            row.className = 'thread-item';
            row.innerHTML = `
                <span class="thread-item-name">
                    <span class="depth-dot" style="background:${depthColor(depth)};"></span>
                    ${child.title}
                </span>
                <span class="thread-item-count">
                    ${count}
                    <svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px;"><path d="M9 18l6-6-6-6"/></svg>
                </span>
            `;
            row.onclick = () => launchForm(child.id, { fromDrill: true });
            list.appendChild(row);
        });
    }

    function saveCurrentRuntimeData() {
        if (!activeFormId || renderedRecordId === null) return;
        if (viewMode !== 'record') return;

        const inputs = document.querySelectorAll('#runtime-card .r-input');
        if (inputs.length === 0) return;

        const currentRecord = findRecordById(activeFormId, renderedRecordId);
        if (!currentRecord) return;

        inputs.forEach(input => {
            currentRecord[input.dataset.name] = input.type === 'checkbox' ? input.checked : input.value;
        });
    }

    function saveCurrentRecordExplicit() {
        saveCurrentRuntimeData();
        const btn = document.getElementById('save-btn');
        if (!btn) return;
        const original = btn.innerHTML;
        btn.classList.add('btn-saved');
        btn.innerHTML = `<svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Guardado`;
        setTimeout(() => {
            btn.classList.remove('btn-saved');
            btn.innerHTML = original;
        }, 1100);
    }

    function clearCurrentRecord() {
        if (!activeFormId || renderedRecordId === null) return;
        const formObj = getForm(activeFormId);
        const currentRecord = findRecordById(activeFormId, renderedRecordId);
        if (!currentRecord) return;

        const hasData = formObj.fields.some(f => {
            const v = currentRecord[f.name];
            return v !== undefined && v !== '' && v !== false;
        });
        if (hasData && !confirm('¿Borrar los datos de este registro? Esta acción no se puede deshacer.')) return;

        formObj.fields.forEach(f => {
            currentRecord[f.name] = f.type === 'checkbox' ? false : '';
        });
        renderRuntime();
    }

    function deleteDescendantRecords(formId, recordId) {
        getChildForms(formId).forEach(child => {
            const toDelete = child.data.filter(r => r._parentId === recordId);
            toDelete.forEach(r => deleteDescendantRecords(child.id, r._id));
            child.data = child.data.filter(r => r._parentId !== recordId);
        });
    }

    function deleteCurrentRecord() {
        if (!activeFormId || renderedRecordId === null) return;
        const formObj = getForm(activeFormId);
        const currentRecord = findRecordById(activeFormId, renderedRecordId);
        if (!currentRecord) return;

        const childCount = getChildForms(activeFormId)
            .reduce((sum, child) => sum + countFilledRecords(child, child.data.filter(r => r._parentId === currentRecord._id)), 0);
        const warning = childCount > 0
            ? `Este registro tiene ${childCount} registro${childCount === 1 ? '' : 's'} relacionado${childCount === 1 ? '' : 's'} que también se eliminarán. ¿Continuar?`
            : '¿Eliminar este registro? Esta acción no se puede deshacer.';
        if (!confirm(warning)) return;

        deleteDescendantRecords(activeFormId, currentRecord._id);
        formObj.data = formObj.data.filter(r => r._id !== currentRecord._id);

        renderedRecordId = null;
        resetDescendantIndices(activeFormId);
        renderRuntime();
    }

    function changeRecord(direction) {
        saveCurrentRuntimeData();
        const list = getVisibleRecords(activeFormId);
        let idx = (activeIndexByForm[activeFormId] || 0) + direction;
        if (idx < 0) idx = 0;
        if (idx >= list.length) idx = list.length - 1;
        activeIndexByForm[activeFormId] = idx;
        resetDescendantIndices(activeFormId);
        renderRuntime();
    }

    function addNewRecord() {
        saveCurrentRuntimeData();
        const formObj = getForm(activeFormId);

        let parentId = null;
        if (formObj.pivotFormId) {
            const parentRecord = getActiveRecord(formObj.pivotFormId);
            if (!parentRecord) { return; }
            parentId = parentRecord._id;
        }

        const newRec = { _id: nextRecordId(), _parentId: parentId };
        formObj.data.push(newRec);

        const list = getVisibleRecords(formObj.id);
        activeIndexByForm[formObj.id] = list.length - 1;
        resetDescendantIndices(formObj.id);
        viewMode = 'record';
        renderRuntime();
    }

    function formToRows(formObj) {
        const records = formObj.data.filter(r => recordIsExportable(formObj.id, r));

        let parentForm = null, parentLabelField = null;
        const headerRow = formObj.fields.map(f => f.name);

        if (formObj.pivotFormId) {
            parentForm = getForm(formObj.pivotFormId);
            parentLabelField = parentForm.fields[0] ? parentForm.fields[0].name : null;
            headerRow.unshift(`${parentForm.title}${parentLabelField ? ' (' + parentLabelField + ')' : ''}`);
        }

        const rows = [headerRow];

        records.forEach(r => {
            const row = formObj.fields.map(f => {
                let v = r[f.name];
                if (f.type === 'checkbox') v = v ? 'Sí' : 'No';
                return v === undefined ? '' : v;
            });
            if (parentForm) {
                const parentRec = findRecordById(parentForm.id, r._parentId);
                const label = parentRec && parentLabelField ? parentRec[parentLabelField] : '';
                row.unshift(label === undefined ? '' : label);
            }
            rows.push(row);
        });

        return rows;
    }

    function sheetNameFor(formObj, usedNames) {
        let base = (formObj.title || `Formulario ${formObj.id}`)
            .replace(/[:\\/\?\*\[\]]/g, ' ')
            .trim()
            .slice(0, 31) || `Form${formObj.id}`;

        let name = base, n = 2;
        while (usedNames.has(name)) {
            const suffix = ` (${n++})`;
            name = base.slice(0, 31 - suffix.length) + suffix;
        }
        usedNames.add(name);
        return name;
    }

    function exportAllData() {
        const exportableForms = formsRegistry.filter(f => f.data.some(r => recordIsExportable(f.id, r)));
        if (exportableForms.length === 0) return;

        const wb = XLSX.utils.book_new();
        const usedNames = new Set();

        exportableForms.forEach(formObj => {
            const rows = formToRows(formObj);
            const ws = XLSX.utils.aoa_to_sheet(rows);

            ws['!cols'] = rows[0].map((_, colIdx) => {
                const maxLen = rows.reduce((m, r) => Math.max(m, String(r[colIdx] ?? '').length), 8);
                return { wch: Math.min(Math.max(maxLen + 2, 10), 40) };
            });

            XLSX.utils.book_append_sheet(wb, ws, sheetNameFor(formObj, usedNames));
        });

        const today = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `DataForge_export_${today}.xlsx`);
    }

    function importExcelData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                let tempForms = [];
                let nextId = 1;
                let rawSheetsData = [];

                workbook.SheetNames.forEach((sheetName) => {
                    const worksheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    if (rows.length === 0) return;

                    let rawHeader = rows[0].map(h => String(h || '').trim()).filter(h => h !== '');
                    if (rawHeader.length === 0) return;

                    rawSheetsData.push({
                        title: sheetName.trim(),
                        rawHeader: rawHeader,
                        rows: rows.slice(1)
                    });
                });

                if (rawSheetsData.length === 0) {
                    alert('No se encontraron datos válidos en el archivo Excel.');
                    return;
                }

                rawSheetsData.forEach((sheet) => {
                    let fields = sheet.rawHeader.map(name => ({ name, type: 'text' }));
                    tempForms.push({
                        id: nextId++,
                        title: sheet.title,
                        pivotFormId: null,
                        pivotField: "",
                        fields: fields,
                        rawRows: sheet.rows,
                        data: []
                    });
                });

                tempForms.forEach((formObj) => {
                    formObj.rawRows.forEach((rowVals) => {
                        if (!rowVals || rowVals.length === 0) return;
                        const rec = { _id: nextRecordId(), _parentId: null };
                        let hasAnyVal = false;

                        formObj.fields.forEach((f, fIdx) => {
                            const val = rowVals[fIdx];
                            if (val !== undefined && val !== null && String(val).trim() !== '') {
                                rec[f.name] = String(val);
                                hasAnyVal = true;
                            } else {
                                rec[f.name] = '';
                            }
                        });

                        if (hasAnyVal) {
                            formObj.data.push(rec);
                        }
                    });
                });

                for (let i = 1; i < tempForms.length; i++) {
                    let childForm = tempForms[i];
                    let bestParentForm = null;
                    let bestParentField = null;
                    let matchingColIndex = -1;

                    for (let p = 0; p < i; p++) {
                        let parentForm = tempForms[p];
                        if (parentForm.data.length === 0) continue;

                        childForm.fields.forEach((childField, cIdx) => {
                            let matchCount = 0;
                            childForm.data.forEach(childRec => {
                                let val = String(childRec[childField.name] || '').trim().toLowerCase();
                                if (!val) return;
                                
                                let foundInParent = parentForm.data.some(parentRec => 
                                    Object.values(parentRec).some(pv => String(pv || '').trim().toLowerCase() === val)
                                );
                                if (foundInParent) matchCount++;
                            });

                            if (matchCount > 0 && matchCount >= Math.min(2, childForm.data.length)) {
                                bestParentForm = parentForm;
                                bestParentField = parentForm.fields[0].name;
                                matchingColIndex = cIdx;
                            }
                        });

                        if (bestParentForm) break;
                    }

                    if (!bestParentForm && i > 0) {
                        bestParentForm = tempForms[i - 1];
                        bestParentField = bestParentForm.fields[0].name;
                        matchingColIndex = 0;
                    }

                    if (bestParentForm) {
                        childForm.pivotFormId = bestParentForm.id;
                        childForm.pivotField = bestParentField;

                        childForm.data.forEach(childRec => {
                            if (matchingColIndex >= 0 && childForm.fields[matchingColIndex]) {
                                let searchKey = String(childRec[childForm.fields[matchingColIndex].name] || '').trim().toLowerCase();
                                
                                let matchedParentRecord = bestParentForm.data.find(pr => 
                                    Object.values(pr).some(pv => String(pv || '').trim().toLowerCase() === searchKey)
                                );

                                if (matchedParentRecord) {
                                    childRec._parentId = matchedParentRecord._id;
                                }
                            }
                            
                            if (!childRec._parentId && bestParentForm.data.length > 0) {
                                childRec._parentId = bestParentForm.data[0]._id;
                            }
                        });
                    }
                }

                tempForms.forEach(f => delete f.rawRows);

                if (tempForms.length > 0) {
                    formsRegistry = tempForms;
                    recordIdCounter = Math.max(...formsRegistry.flatMap(f => f.data.map(r => r._id || 0)), 0) + 1;
                    activeIndexByForm = {};
                    showLauncher();
                    alert('¡Datos y dependencias de Excel cargados exitosamente!');
                } else {
                    alert('No se pudieron procesar datos válidos de las hojas.');
                }
            } catch (err) {
                console.error(err);
                alert('Ocurrió un error al leer el archivo Excel. Verifique que la estructura sea correcta.');
            } finally {
                event.target.value = '';
            }
        };
        reader.readAsArrayBuffer(file);
    }

    showLauncher();
</script>
